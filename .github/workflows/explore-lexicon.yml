name: Build Wiktionary Urdu lexicon
on: workflow_dispatch
jobs:
  lexicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install numpy scipy
          curl -fL --retry 5 -o urdu.jsonl https://kaikki.org/dictionary/Urdu/kaikki.org-dictionary-Urdu.jsonl
          python packaging/build_wiktionary_lexicon.py urdu.jsonl lexicon_wiktionary.tsv
          wc -l lexicon_wiktionary.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: lexicon-wiktionary
          path: lexicon_wiktionary.tsv
